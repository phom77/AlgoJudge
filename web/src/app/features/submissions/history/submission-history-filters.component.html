<label>
  <span>Problem</span>
  <input
    type="search"
    maxlength="100"
    autocomplete="off"
    placeholder="Search title or slug"
    [formControl]="problemSearchControl"
  />
  @if (problemSearchControl.invalid) {
    <small>Problem search must not exceed 100 characters.</small>
  }
</label>

<label>
  <span>Verdict</span>
  <select [value]="query().status ?? ''" (change)="changeStatus($event)">
    <option value="">All verdicts</option>
    <option value="Pending">Pending</option>
    <option value="Running">Running</option>
    <option value="Accepted">Accepted</option>
    <option value="WrongAnswer">Wrong Answer</option>
    <option value="TimeLimitExceeded">Time Limit Exceeded</option>
    <option value="MemoryLimitExceeded">Memory Limit Exceeded</option>
    <option value="CompileError">Compile Error</option>
    <option value="RuntimeError">Runtime Error</option>
  </select>
</label>
