<div class="editor" [class.editor--ready]="ready()">
  <div #host class="editor__host"></div>
  @if (!ready()) {
    <textarea
      class="editor__fallback"
      spellcheck="false"
      [attr.aria-label]="ariaLabel()"
      [value]="value()"
      (input)="updateFallback($event)"
    ></textarea>
    <span class="editor__status" aria-live="polite">
      {{ failed() ? 'Basic editor active' : 'Loading editor…' }}
    </span>
  }
</div>
